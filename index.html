<style id="mu-duo">
/* ===== Math Up "Duo" layer: friendly flat colour, chunky 3D buttons, springy motion ===== */
:root{--d-green:#58CC02;--d-green-d:#58A700;--d-blue:#1CB0F6;--d-blue-d:#1899D6;--d-gold:#FFC800;--d-gold-d:#E5B400;--d-red:#FF4B4B;--d-red-d:#EA2B2B;--d-line:#E5E5E5;--d-ink:#3C3C3C;--d-spring:cubic-bezier(.34,1.56,.64,1)}
.pg[data-p]{--ink:#3C3C3C;--muted:#777;--line:#E5E5E5;--grid:transparent;--accent:#1CB0F6;--ok:#58A700;--err:#EA2B2B;background:#fff!important;background-image:none!important;color:var(--d-ink)}
.pg[data-p] :is(.sheet,.card,.tile,.plan-i,.agent,.paper,.boss-entry,.opt,.lv){border:2px solid var(--d-line)!important;box-shadow:0 4px 0 var(--d-line)!important;border-radius:18px}
.pg[data-p] :is(.lv,.opt,.card,.tile){transition:transform .12s,box-shadow .12s}
.pg[data-p] :is(.lv,.opt,.tile):active{transform:translateY(4px);box-shadow:0 0 0 var(--d-line)!important}
/* chunky buttons: green go, white alt, press sinks 4px */
.pg[data-p] .btn{border:0!important;border-radius:16px!important;background:var(--d-green)!important;color:#fff!important;font-weight:700!important;letter-spacing:.02em;text-transform:none;box-shadow:0 5px 0 var(--d-green-d)!important;transition:transform .08s,box-shadow .08s,filter .15s;position:relative;top:0}
.pg[data-p] .btn:active{transform:translateY(5px);box-shadow:0 0 0 var(--d-green-d)!important}
.pg[data-p] .btn.alt{background:#fff!important;color:var(--d-blue-d)!important;border:2px solid var(--d-line)!important;box-shadow:0 4px 0 var(--d-line)!important}
.pg[data-p] .btn.alt:active{transform:translateY(4px);box-shadow:0 0 0 var(--d-line)!important}
.pg[data-p] .btn:disabled{background:var(--d-line)!important;color:#AFAFAF!important;box-shadow:0 5px 0 #CFCFCF!important}
.pg[data-p] .tabs button[aria-selected="true"]{background:#DDF4FF;border-color:var(--d-blue);color:var(--d-blue-d);box-shadow:0 3px 0 var(--d-blue)}
.pg[data-p] input{border:2px solid var(--d-line)!important;border-radius:14px!important;background:#F7F7F7;transition:border-color .15s,background .15s}
.pg[data-p] input:focus{outline:0;border-color:var(--d-blue)!important;background:#fff}
/* XP / progress bars: gold fill, glossy, shine sweep */
.pg[data-p] :is(.xpbar,.bar,.sc-bar){border:0!important;background:var(--d-line)!important;border-radius:99px;overflow:hidden;position:relative}
.pg[data-p] :is(.xpbar,.bar,.sc-bar)>i{position:relative;background:var(--d-gold)!important;border-radius:99px;overflow:hidden;transition:width 1.1s cubic-bezier(.22,1,.36,1)}
.pg[data-p] :is(.xpbar,.bar,.sc-bar)>i::before{content:"";position:absolute;left:8px;right:8px;top:22%;height:26%;border-radius:99px;background:rgba(255,255,255,.4)}
.pg[data-p] :is(.xpbar,.bar,.sc-bar)>i::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-50%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:duoShine 2.8s 1.2s ease-in-out infinite}
.pg[data-p] .bar.flash,.pg[data-p] .xpbar.flash{animation:duoFlash .7s}
.pg[data-p] .lvb,.pg[data-p] .sc-lv{background:var(--d-gold)!important;border:0!important;box-shadow:0 4px 0 var(--d-gold-d);text-shadow:0 2px 0 rgba(0,0,0,.15)}
.pg[data-p] .lvb.duo-pop{animation:duoBadge .9s var(--d-spring)}
/* feedback, whatever the screen calls it */
.pg [class~="bad"],.pg [class~="wrong"]{animation:duoShake .42s}
.pg [class~="good"],.pg [class~="right"]{animation:duoPop .38s var(--d-spring)}
/* page + tile entrance (one quick slide, then springy tiles) */
.pg.duo-in>.page,.pg.duo-in>.wrap{animation:duoSlide .28s cubic-bezier(.22,1,.36,1)}
.pg.duo-in .lv{animation:duoPop .45s var(--d-spring) backwards}
.pg.duo-in .lv:nth-child(2){animation-delay:.05s}.pg.duo-in .lv:nth-child(3){animation-delay:.1s}.pg.duo-in .lv:nth-child(4){animation-delay:.15s}.pg.duo-in .lv:nth-child(n+5){animation-delay:.2s}
/* loader: top bar + bouncing dots when the server is slow */
#duo-load{position:fixed;left:0;right:0;top:0;height:3px;z-index:6000;pointer-events:none;overflow:hidden;visibility:hidden;opacity:0;transition:opacity .2s,visibility 0s .2s}
#duo-load::before{content:"";position:absolute;top:0;bottom:0;left:0;width:80%;border-radius:3px;background:linear-gradient(90deg,transparent 0,var(--d-blue) 18%,var(--d-green) 50%,var(--d-gold) 82%,transparent 100%);transform:translateX(-100%);will-change:transform}
#duo-load.on{visibility:visible;opacity:1;transition:opacity .15s}
#duo-load.on::before{animation:duoSweep 1.2s cubic-bezier(.4,0,.6,1) infinite}
#duo-dots{position:fixed;left:50%;top:40%;z-index:6000;display:none;gap:8px;transform:translateX(-50%);padding:14px 18px;border-radius:18px;background:#fff;border:2px solid var(--d-line);box-shadow:0 4px 0 var(--d-line)}
#duo-dots.on{display:flex;animation:duoPop .3s var(--d-spring)}
#duo-dots i{width:12px;height:12px;border-radius:50%;background:var(--d-blue);animation:duoBounce .9s infinite}

.duo-xp{position:fixed;z-index:6001;pointer-events:none;font:700 22px "Fredoka",system-ui,sans-serif;color:#fff;background:var(--d-gold);padding:4px 14px;border-radius:99px;box-shadow:0 4px 0 var(--d-gold-d);animation:duoRise 1.6s cubic-bezier(.22,1,.36,1) forwards}
.duo-c{position:fixed;z-index:6001;pointer-events:none;width:9px;height:14px;border-radius:3px;animation:duoConf 1.4s cubic-bezier(.2,.7,.3,1) forwards}

.upi-dock{--upi-size:66px!important}
.upi-dock.duo-hide{opacity:0!important;pointer-events:none!important;transform:translateY(40px) scale(.7)!important}
.upi-dock.duo-peek{transform:translateX(48%) rotate(-8deg)!important}

/* ===== button colours: every button type gets its own clear colour ===== */
.pg[data-p] .btn:not(:disabled).blue{background:var(--d-blue)!important;color:#fff!important;box-shadow:0 5px 0 var(--d-blue-d)!important}
.pg[data-p] .btn:not(:disabled).blue:active{box-shadow:0 0 0 var(--d-blue-d)!important}

<template id="tpl-privacy"><div class="page"><main>
<div class="name"><a href="#/login">Math Up</a></div>
<div class="sheet">
<h1>Privacy Policy</h1>
<p class="date">Last updated: [DATE]</p>
<p>Math Up is a maths practice site for children. This page explains what we collect, why, and the choices you have. [BUSINESS NAME] runs Math Up.</p>
<h2>What we collect</h2>
<p>From the parent:</p>
<ul><li>Your email address and password.</li></ul>
<p>For each child you add:</p>
<ul>
<li>A name or nickname. You can use a first name only.</li>
<li>The learning level chosen from the age you enter. We don't store the age itself.</li>
<li>A student ID and a 4-number PIN.</li>
<li>Learning progress: stars, worksheets done and practice results.</li>
</ul>
<p>We don't ask children for their email, address, phone number, photo or school.</p>
<h2>Why we collect it</h2>
<p>To run your account, let children log in, save their progress across devices, and show it on your dashboard. We don't use it for advertising and we don't sell it.</p>
<h2>How it is kept safe</h2>
<ul>
<li>Passwords and PINs are stored scrambled (hashed with a salt), so we can't read them.</li>
<li>Logins are locked for a while after several wrong tries, and for longer if it keeps happening.</li>
<li>A parent can only see and change their own children.</li>
<li>Data is stored in a Google Sheet on Google's servers, which may be outside Malaysia.</li>
</ul>
<p>No system is perfectly secure, so please choose a strong password and keep PINs private.</p>
<h2>On your device</h2>

.upi{position:relative;width:var(--upi-size,140px);aspect-ratio:160/190;flex:none;-webkit-tap-highlight-color:transparent}
.upi svg{width:100%;height:100%;display:block;overflow:visible}
.upi .u-float{animation:uFloat 3s ease-in-out infinite}
.upi-dock svg{filter:drop-shadow(2.5px 0 0 #fff) drop-shadow(-2.5px 0 0 #fff) drop-shadow(0 2.5px 0 #fff) drop-shadow(0 -2.5px 0 #fff) drop-shadow(0 4px 6px rgba(20,40,75,.18))}   /* a white sticker edge, so the flat Upi stands out on any colour */
.upi .u-shadow{transform-box:fill-box;transform-origin:50% 50%;animation:uShadow 3s ease-in-out infinite}
.upi .u-jet{transform-box:fill-box;transform-origin:50% 0;animation:uJet .35s ease-in-out infinite alternate}
.upi .u-star{transform-box:fill-box;transform-origin:50% 50%;animation:uTwinkle 2.6s ease-in-out infinite}
.upi .u-eyes{transform-box:fill-box;transform-origin:50% 50%;animation:uBlink 4.2s infinite}
.upi .u-look{transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.upi .u-armL,.upi .u-armR{transform-box:fill-box;transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.upi .u-armL{transform-origin:50% 10%;transform:rotate(12deg)}
.upi .u-armR{transform-origin:50% 10%;transform:rotate(-12deg)}
.upi .u-head{transform-box:fill-box;transform-origin:50% 90%;transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.upi .u-e-happy,.upi .u-e-shut,.upi .u-e-sad,.upi .u-brows,.upi .u-m-open,.upi .u-m-o,.upi .u-m-flat,.upi .u-board,.upi .u-zzz,.upi .u-dots,.upi .u-stars{opacity:0;transition:opacity .2s}
/* idle: arms swing a little */
.upi.p-idle .u-armL{animation:uSwingL 3s ease-in-out infinite}
.upi.p-idle .u-armR{animation:uSwingR 3s ease-in-out infinite}
/* wave hello */
.upi.p-wave .u-armR{animation:uWave .5s ease-in-out infinite alternate}
.upi.p-wave .u-e-open{opacity:0}.upi.p-wave .u-e-happy{opacity:1}
/* talking: mouth opens and closes */
.upi.talking .u-m-smile{opacity:0}
.upi.talking .u-m-open{opacity:1;animation:uTalk .16s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 30%}
/* think */
.upi.p-think .u-armR{transform:rotate(-132deg) translate(-4px,0)}
.upi.p-think .u-head{transform:rotate(-6deg)}
.upi.p-think .u-look{transform:translate(4px,-4px)}
.upi.p-think .u-m-smile{opacity:0}.upi.p-think .u-m-flat{opacity:1}
.upi.p-think .u-dots{opacity:1}.upi.p-think .u-dots circle{animation:uDot 1.2s ease-in-out infinite}
.upi.p-think .u-dots circle:nth-child(2){animation-delay:.2s}.upi.p-think .u-dots circle:nth-child(3){animation-delay:.4s}
/* point left / right */
.upi.p-point-r .u-armR{transform:rotate(-100deg)}
.upi.p-point-l .u-armL{transform:rotate(100deg)}
.upi.p-point-r .u-look{transform:translate(5px,0)}.upi.p-point-l .u-look{transform:translate(-5px,0)}
.upi.p-point-up .u-armR{transform:rotate(-148deg)}.upi.p-point-up .u-look{transform:translate(4px,-6px)}.upi.p-point-up .u-e-open{opacity:1}
/* teach: holds a little board */
.upi.p-teach .u-armL{transform:rotate(58deg)}
.upi.p-teach .u-board{opacity:1}
.upi.p-teach .u-armR{animation:uWave .7s ease-in-out infinite alternate;transform:rotate(-70deg)}
/* cheer: jump with both arms up and stars */
.upi.p-cheer .u-float{animation:uJump .6s cubic-bezier(.3,1.4,.5,1) infinite alternate}
.upi.p-cheer .u-armL{transform:rotate(128deg)}.upi.p-cheer .u-armR{transform:rotate(-128deg)}
.upi.p-cheer .u-e-open{opacity:0}.upi.p-cheer .u-e-happy{opacity:1}
.upi.p-cheer .u-m-smile{opacity:0}.upi.p-cheer .u-m-o{opacity:1}
.upi.p-cheer .u-stars{opacity:1}.upi.p-cheer .u-stars path{transform-box:fill-box;transform-origin:50% 50%;animation:uPop 1s ease-out infinite}
.upi.p-cheer .u-stars g:nth-child(2) path{animation-delay:.3s}.upi.p-cheer .u-stars g:nth-child(3) path{animation-delay:.6s}
/* sad / not yet: gentle and kind */
.upi.p-sad .u-float{animation:uFloat 4.5s ease-in-out infinite}
.upi.p-sad .u-head{transform:rotate(7deg) translateY(3px)}
.upi.p-sad .u-armL{transform:rotate(4deg)}.upi.p-sad .u-armR{transform:rotate(-4deg)}
.upi.p-sad .u-e-open{opacity:0}.upi.p-sad .u-e-sad,.upi.p-sad .u-brows{opacity:1}
.upi.p-sad .u-m-smile{opacity:0}.upi.p-sad .u-m-flat{opacity:1}
/* sleep */
.upi.p-sleep .u-float{animation:uFloat 6s ease-in-out infinite}
.upi.p-sleep .u-e-open{opacity:0}.upi.p-sleep .u-e-shut{opacity:1}
.upi.p-sleep .u-m-smile{opacity:0}.upi.p-sleep .u-m-o{opacity:.8;transform:scale(.6);transform-box:fill-box;transform-origin:50% 50%}

.upi.p-sleep .u-armL{transform:rotate(6deg)}.upi.p-sleep .u-armR{transform:rotate(-6deg)}

.upi.p-wow .u-m-smile{opacity:0}.upi.p-wow .u-m-o{opacity:1}
.upi.p-wow .u-eyes{transform:scale(1.18)}
.upi.p-wow .u-armL{transform:rotate(60deg)}.upi.p-wow .u-armR{transform:rotate(-60deg)}
