/* ===== login ===== */
.pg[data-p="login"]{
  --ink:#14284B; --muted:#54627A; --line:#9FB0C8; --grid:#DCE8F7; --accent:#1F5EFF; --err:#C62828;
  --font:"Fredoka",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
.pg[data-p="login"] *{box-sizing:border-box}
.pg[data-p="login"],.pg[data-p="login"]{height:100%;margin:0}
.pg[data-p="login"]{color:var(--ink);font:400 17px/1.5 var(--font);
  background-color:#fff;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.pg[data-p="login"] .page{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:28px 20px}
.pg[data-p="login"] main{width:100%;max-width:400px;margin:0 auto}
.pg[data-p="login"] .sheet{background:#fff;border:2.5px solid var(--ink);border-radius:22px;padding:22px 20px 24px}
.pg[data-p="login"] h1{margin:0 0 4px;font-size:clamp(1.9rem,8vw,2.3rem);line-height:1.1;font-weight:700}
.pg[data-p="login"] .sub{margin:0 0 18px;color:var(--muted)}
.pg[data-p="login"] .tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}
.pg[data-p="login"] .tabs button{height:52px;border:2px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink);font:inherit;font-size:16px;font-weight:600;cursor:pointer}
.pg[data-p="login"] .tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.pg[data-p="login"] .field{margin-bottom:14px}
.pg[data-p="login"] label{display:block;margin-bottom:6px;font-size:16px;font-weight:500}
.pg[data-p="login"] .control{position:relative}
.pg[data-p="login"] input{width:100%;height:58px;padding:0 16px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font:inherit;font-size:18px}
.pg[data-p="login"] input::placeholder{color:#8A99B0}

.pg[data-p="login"] input[aria-invalid="true"]{border-color:var(--err)}
.pg[data-p="login"] .pin-show{position:static !important;display:block;margin:4px auto 0}
.pg[data-p="login"] .toggle{position:absolute;right:6px;top:7px;height:44px;padding:0 12px;border:0;border-radius:10px;background:transparent;color:var(--accent);font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.pg[data-p="login"] .err{min-height:20px;margin:4px 0 0;font-size:14px;color:var(--err)}
.pg[data-p="login"] .help{margin:0 0 18px;font-size:15px;color:var(--muted)}
.pg[data-p="login"] a{color:var(--accent);font-weight:500;text-decoration:none}
.pg[data-p="login"] a:hover{text-decoration:underline}
.pg[data-p="login"] .btn{width:100%;height:60px;border:0;border-radius:16px;background:var(--accent);color:#fff;font:inherit;font-size:19px;font-weight:600;cursor:pointer}
.pg[data-p="login"] .btn[disabled]{opacity:.65;cursor:default}
.pg[data-p="login"] .status{min-height:22px;margin:12px 0 0;font-size:15px;color:var(--err);text-align:center}
.pg[data-p="login"] .getapp{margin:14px 0 96px;background:#fff;border:2.5px solid var(--ink);border-radius:18px;padding:14px 14px 16px;text-align:center}
.pg[data-p="login"] .getapp[hidden],.pg[data-p="login"] .getapp [hidden]{display:none}
.pg[data-p="login"] .ga-t{margin:0;font-weight:700;font-size:18px;color:var(--ink)}
.pg[data-p="login"] .ga-s{margin:2px 0 12px;font-size:14.5px;color:var(--muted)}
.pg[data-p="login"] .ga-install{width:100%;min-height:54px;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--accent);color:#fff;border:2.5px solid var(--ink);border-radius:14px;font:inherit;font-size:18px;font-weight:700;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.pg[data-p="login"] .ga-install:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.pg[data-p="login"] .ga-install:focus-visible{outline:3px solid #FFC233;outline-offset:3px}
.pg[data-p="login"] .ga-help{margin-top:18px;text-align:left}
.pg[data-p="login"] .ga-note{margin:0 0 10px;padding:8px 12px;background:#FFF3D6;border:2px solid var(--ink);border-radius:12px;font-size:14.5px;color:var(--ink)}
.pg[data-p="login"] .ga-help ol{list-style:none;margin:0;padding:0}
.pg[data-p="login"] .ga-help li{display:flex;align-items:center;gap:10px;background:#EAF1FF;border:2px solid var(--ink);border-radius:12px;padding:9px 12px;margin:0 0 8px;font-size:15.5px;color:var(--ink)}
.pg[data-p="login"] .ga-help li:last-child{margin-bottom:0}
.pg[data-p="login"] .ga-help .n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center}
.pg[data-p="login"] .ga-done{margin:0;padding:10px 12px;background:#E6F6EC;border:2px solid var(--ink);border-radius:12px;font-size:15.5px;font-weight:600;color:var(--ink)}
.pg[data-p="login"] .alt{margin:18px 0 0;text-align:center;color:var(--muted);font-size:15px;background:#fff;border-radius:12px;padding:6px 10px}
.pg[data-p="login"] [hidden]{display:none!important}
.pg[data-p="login"] .langrow{display:flex;justify-content:center;margin:0 0 14px}

.pg[data-p="login"] .langsw::before{content:"";position:absolute;top:3px;left:3px;width:calc(50% - 3px);height:calc(100% - 6px);border-radius:99px;background:var(--ink);transition:transform .22s cubic-bezier(.34,1.56,.64,1)}
.pg[data-p="login"] .langsw[aria-checked="true"]::before{transform:translateX(100%)}
.pg[data-p="login"] .langsw span{position:relative;z-index:1;display:grid;place-items:center;transition:color .2s}
.pg[data-p="login"] .langsw[aria-checked="false"] span:first-child,.pg[data-p="login"] .langsw[aria-checked="true"] span:last-child{color:#fff}
@media (prefers-reduced-motion:reduce){.pg[data-p="login"] .langsw::before{transition:none}}

.pg[data-p="boss"] .stars-bg{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 20% 18%,#fff8 50%,transparent 51%),radial-gradient(1.5px 1.5px at 70% 10%,#fff9 50%,transparent 51%),radial-gradient(2px 2px at 85% 34%,#fff6 50%,transparent 51%),radial-gradient(1.5px 1.5px at 35% 40%,#fff7 50%,transparent 51%),radial-gradient(2px 2px at 55% 26%,#fff5 50%,transparent 51%),radial-gradient(1.5px 1.5px at 10% 36%,#fff8 50%,transparent 51%);animation:twinkle_boss 4s ease-in-out infinite alternate}
@keyframes twinkle_boss{from{opacity:.6}to{opacity:1}}
.pg[data-p="boss"] .top{position:relative;z-index:35;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 6px;color:#fff}
.pg[data-p="boss"] .top .title{flex:1;display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;letter-spacing:.3px}
.pg[data-p="boss"] .ib[hidden]{display:none}
.pg[data-p="boss"] .ib{text-decoration:none;width:42px;height:42px;border-radius:14px;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;font:600 18px var(--font);display:grid;place-items:center;cursor:pointer}
.pg[data-p="boss"] .timer{position:relative;z-index:3;margin:2px 14px 0;height:14px;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden;border:2px solid rgba(255,255,255,.25)}
.pg[data-p="boss"] .timer i{display:block;height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,#3DDC97,#9BF26B);transition:width .25s linear}
.pg[data-p="boss"] .timer.low i{background:linear-gradient(90deg,#FF6B6B,#FF9F43);animation:pulse_boss .5s ease-in-out infinite alternate}
.pg[data-p="boss"] .tsec{position:relative;z-index:3;text-align:right;margin:2px 16px 0;color:#fff;font-weight:700;font-size:15px}
@keyframes pulse_boss{from{opacity:.65}to{opacity:1}}
.pg[data-p="boss"] .stage{position:relative;flex:1 1 auto;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:6px}
.pg[data-p="boss"] .bossname{position:relative;z-index:2;color:#fff;font-weight:700;font-size:17px;margin-bottom:4px;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.pg[data-p="boss"] .hp{position:relative;z-index:2;width:78%;height:20px;border-radius:99px;background:#2A1B4D;border:3px solid #fff;overflow:hidden;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.pg[data-p="boss"] .hp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#FF4D6D,#FF8E53);transition:width .45s cubic-bezier(.22,1,.36,1)}
.pg[data-p="boss"] .hp b{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.pg[data-p="boss"] .boss{position:relative;z-index:1;width:min(70vw,290px);aspect-ratio:240/220;margin-bottom:8px;animation:bob_boss 2.4s ease-in-out infinite}
.pg[data-p="boss"] .boss svg{width:100%;height:100%;display:block;overflow:visible}
.pg[data-p="boss"] .boss.hit svg{animation:hit_boss .35s ease}
.pg[data-p="boss"] .boss.hit .flash{animation:flash_boss .3s ease}
.pg[data-p="boss"] .flash{opacity:0}
.pg[data-p="boss"] .eyes-ouch{opacity:0}
.pg[data-p="boss"] .boss.ouch .eyes-ok{opacity:0}
.pg[data-p="boss"] .boss.ouch .eyes-ouch{opacity:1}
.pg[data-p="boss"] .boss.dead{animation:none}
.pg[data-p="boss"] .boss.dead svg{animation:boom_boss .9s ease-in forwards}
.pg[data-p="boss"] .boss.flee svg{animation:flee_boss 1.2s ease-in forwards}
@keyframes bob_boss{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes hit_boss{0%{transform:translate(0)}20%{transform:translate(-10px,4px) rotate(-4deg)}45%{transform:translate(9px,-3px) rotate(3deg)}70%{transform:translate(-5px,2px)}100%{transform:none}}
@keyframes flash_boss{0%,100%{opacity:0}30%{opacity:.85}}
@keyframes boom_boss{0%{transform:scale(1)}30%{transform:scale(1.15) rotate(-6deg)}100%{transform:scale(.1) rotate(25deg);opacity:0}}
@keyframes flee_boss{0%{transform:none}30%{transform:translateY(-8px) scale(1.05)}100%{transform:translate(160%,-30px) scale(.6);opacity:0}}
.pg[data-p="boss"] .upi-spot{position:absolute;left:8px;bottom:42px;z-index:2;--upi-size:70px}
.pg[data-p="boss"] .dmg{position:absolute;z-index:6;color:#FFE27A;font-weight:700;font-size:28px;text-shadow:0 3px 0 #C2410C,0 0 12px rgba(255,200,80,.8);pointer-events:none;animation:dmg_boss 1s ease-out forwards}
@keyframes dmg_boss{0%{transform:translate(-50%,0) scale(.6);opacity:0}20%{transform:translate(-50%,-10px) scale(1.25);opacity:1}100%{transform:translate(-50%,-70px) scale(1);opacity:0}}
.pg[data-p="boss"] .combo{position:absolute;z-index:6;left:50%;top:22%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;color:#fff;font-weight:700;font-size:30px;text-shadow:0 3px 0 #7048E8,0 0 18px #B197FC;pointer-events:none;animation:comboIn_boss 1.1s cubic-bezier(.34,1.56,.64,1) forwards;white-space:nowrap}
@keyframes comboIn_boss{0%{transform:translateX(-50%) scale(.3);opacity:0}25%{transform:translateX(-50%) scale(1.15);opacity:1}75%{opacity:1}100%{transform:translateX(-50%) scale(1) translateY(-20px);opacity:0}}
.pg[data-p="boss"] .shield{position:absolute;z-index:5;width:150px;height:150px;border-radius:50%;pointer-events:none;border:5px solid #8FD3FF;box-shadow:0 0 24px #8FD3FF,inset 0 0 24px #8FD3FF;animation:shield_boss .6s ease-out forwards}
.pg[data-p="boss"] .shield span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;font-weight:700;font-size:20px;text-shadow:0 2px 6px #1C7ED6}
@keyframes shield_boss{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}30%{opacity:1}100%{transform:translate(-50%,-50%) scale(1.15);opacity:0}}
.pg[data-p="boss"] .orb{position:fixed;left:0;top:0;z-index:20;width:22px;height:22px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 35% 35%,#fff 0%,#FFF3B0 25%,#FFC233 55%,rgba(255,160,40,.0) 72%);box-shadow:0 0 16px 6px rgba(255,214,90,.75),0 0 34px 12px rgba(255,170,60,.35)}
.pg[data-p="boss"] .orb.big{width:32px;height:32px;background:radial-gradient(circle at 35% 35%,#fff 0%,#E5DBFF 25%,#9775FA 55%,rgba(120,80,250,0) 72%);box-shadow:0 0 20px 8px rgba(177,151,252,.8),0 0 40px 16px rgba(120,80,250,.4)}
.pg[data-p="boss"] .spark{position:fixed;left:0;top:0;z-index:21;width:8px;height:8px;border-radius:50%;background:#FFE27A;box-shadow:0 0 8px #FFC233;pointer-events:none}
.pg[data-p="boss"] .panel{position:relative;z-index:4;background:#fff;border-radius:24px 24px 0 0;padding:10px 12px 10px;box-shadow:0 -6px 24px rgba(0,0,0,.25)}
.pg[data-p="boss"] .ic{display:inline-grid;place-items:center;vertical-align:middle;flex:none}
.pg[data-p="boss"] .ic svg{width:100%;height:100%;display:block}
.pg[data-p="boss"] .qrow{display:flex;align-items:center;gap:10px}
.pg[data-p="boss"] .q{flex:1;font-size:clamp(22px,6.8vw,28px);font-weight:700;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg[data-p="boss"] .ans{min-width:96px;height:46px;border:3px solid var(--ink);border-radius:14px;display:grid;place-items:center;font-size:24px;font-weight:700;background:#F5F8FF;padding:0 10px}
.pg[data-p="boss"] .ans.shake{animation:shake_boss .35s ease}
.pg[data-p="boss"] .ans.glow{animation:glowA_boss .4s ease}
@keyframes shake_boss{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes glowA_boss{0%{box-shadow:0 0 0 0 rgba(255,194,51,.9);background:#FFF6D6}100%{box-shadow:0 0 0 16px rgba(255,194,51,0)}}
.pg[data-p="boss"] .pad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.pg[data-p="boss"] .pad button{height:42px;border-radius:12px;border:2.5px solid var(--ink);background:#fff;color:var(--ink);font:700 20px var(--font);box-shadow:0 3px 0 var(--ink);cursor:pointer;transition:transform .06s ease;display:flex;align-items:center;justify-content:center;gap:6px}
.pg[data-p="boss"] .pad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.pg[data-p="boss"] .pad button.x{background:#F1F3F8;font-size:20px}
.pg[data-p="boss"] .pad button.fire{grid-column:span 2;background:linear-gradient(180deg,#FFD34D,#FFA41B);font-size:19px}
.pg[data-p="boss"] .pad button.fire.one{grid-column:span 1;font-size:17px;gap:4px}
.pg[data-p="boss"] .pad button[hidden]{display:none}
.pg[data-p="boss"] .overlay{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(10,18,45,.62);animation:fadeIn_boss .3s ease}
@keyframes fadeIn_boss{from{opacity:0}to{opacity:1}}
.pg[data-p="boss"] .card{width:100%;max-width:400px;background:#fff;border:3px solid var(--ink);border-radius:26px;padding:20px 18px;text-align:center;box-shadow:0 8px 0 var(--ink);animation:pop_boss .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop_boss{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.pg[data-p="boss"] .card h1{margin:4px 0 2px;font-size:28px}
.pg[data-p="boss"] .card p{margin:6px 0;color:#54627A}
.pg[data-p="boss"] .card .bosspic{width:170px;height:156px;margin:0 auto}
.pg[data-p="boss"] .card .bosspic svg{width:100%;height:100%}
.pg[data-p="boss"] .card label{display:block;text-align:left;font-weight:600;margin:12px 0 6px}
.pg[data-p="boss"] .card select{width:100%;height:50px;border-radius:14px;border:2.5px solid #9FB0C8;font:500 16px var(--font);padding:0 10px;color:var(--ink);background:#fff}
.pg[data-p="boss"] .go{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:58px;margin-top:14px;border:0;border-radius:18px;background:linear-gradient(180deg,#FFD34D,#FFA41B);color:var(--ink);font:700 22px var(--font);box-shadow:0 5px 0 #C27B00;cursor:pointer}
.pg[data-p="boss"] .go:active{transform:translateY(3px);box-shadow:0 2px 0 #C27B00}
.pg[data-p="boss"] .go.alt{background:#fff;border:2.5px solid var(--ink);box-shadow:0 4px 0 var(--ink);font-size:18px;height:50px}
.pg[data-p="boss"] .reward{display:flex;justify-content:center;gap:8px;margin:8px 0;font-size:34px}
.pg[data-p="boss"] .reward span{animation:pop_boss .5s cubic-bezier(.34,1.56,.64,1) both}
.pg[data-p="boss"] .reward span:nth-child(2){animation-delay:.15s}
.pg[data-p="boss"] .reward span:nth-child(3){animation-delay:.3s}
.pg[data-p="boss"] .stats{display:flex;justify-content:center;gap:10px;margin:6px 0 2px;flex-wrap:wrap}
.pg[data-p="boss"] .stats div{display:flex;align-items:center;gap:6px;background:#F1F5FF;border-radius:12px;padding:6px 10px;font-weight:600;font-size:15px}
.pg[data-p="boss"] .coll{display:flex;justify-content:center;gap:10px;margin-top:12px}
.pg[data-p="boss"] .coll div{width:64px;height:64px;border-radius:16px;border:2.5px dashed #9FB0C8;display:grid;place-items:center;background:#F7F9FD;position:relative}
.pg[data-p="boss"] .coll div.got{border:2.5px solid var(--ink);background:#FFF8E1}
.pg[data-p="boss"] .coll div svg{width:56px;height:52px}
.pg[data-p="boss"] .coll div:not(.got) svg{filter:grayscale(1) brightness(.3);opacity:.25}
.pg[data-p="boss"] .coll small{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:11px;color:#54627A;white-space:nowrap}
.pg[data-p="boss"] .note{font-size:13px;color:#54627A;margin-top:24px}
.pg[data-p="boss"] .card .auto{margin:12px 0 4px;padding:10px 12px;border-radius:14px;background:#F1F5FF;border:2px solid #C9D9FF;color:var(--ink);font-size:16px;line-height:1.4}

.pg[data-p="boss"] .card .auto .ic{vertical-align:-3px}
.pg[data-p="boss"] .card .left{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;font-size:14px;font-weight:600;color:#54627A;margin-top:10px}

/* ===== admin ===== */

/* ===== avatar ===== */
.pg[data-p="avatar"]{--ink:#14284B;--muted:#54627A;--grid:#DCE8F7;--accent:#1F5EFF;--gold:#FFC233}
.pg[data-p="avatar"]{margin:0;color:var(--ink);font:500 16px/1.4 "Fredoka",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background-color:#fff;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
.pg[data-p="avatar"] .wrap{max-width:520px;margin:0 auto;padding:16px 14px 120px}
.pg[data-p="avatar"] .top{display:flex;align-items:center;justify-content:space-between}
.pg[data-p="avatar"] .top a{color:var(--accent);font-weight:600;text-decoration:none}
.pg[data-p="avatar"] .hero{display:flex;flex-direction:column;align-items:center;gap:8px;margin:8px 0 14px;padding:16px;background:#fff;border:3px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--ink)}
.pg[data-p="avatar"] .hero .pv svg{width:190px;height:190px}
.pg[data-p="avatar"] .hero h1{margin:0;font-size:24px}
.pg[data-p="avatar"] .stars{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:99px;background:#FFF3BF;border:2.5px solid var(--ink);font-weight:700;font-size:18px}
.pg[data-p="avatar"] .stars svg{width:22px;height:22px}
.pg[data-p="avatar"] .tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.pg[data-p="avatar"] .tabs button{height:50px;border-radius:16px;border:3px solid var(--ink);background:#fff;font:600 17px "Fredoka",system-ui,sans-serif;color:var(--ink);box-shadow:0 4px 0 var(--ink);cursor:pointer}
.pg[data-p="avatar"] .tabs button[aria-pressed="true"]{background:var(--accent);color:#fff}
.pg[data-p="avatar"] h2{font-size:18px;margin:16px 0 8px}
.pg[data-p="avatar"] .sw{display:flex;flex-wrap:wrap;gap:10px}
.pg[data-p="avatar"] .sw button{width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.pg[data-p="avatar"] .sw button[aria-pressed="true"]{outline:4px solid var(--gold);outline-offset:2px}
.pg[data-p="avatar"] .opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pg[data-p="avatar"] .opt{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px 10px;border:3px solid var(--ink);border-radius:18px;background:#fff;font:600 14px "Fredoka",system-ui,sans-serif;color:var(--ink);cursor:pointer;box-shadow:0 4px 0 var(--ink);text-align:center}
.pg[data-p="avatar"] .opt svg{width:76px;height:76px}
.pg[data-p="avatar"] .opts.two{grid-template-columns:1fr 1fr}
.pg[data-p="avatar"] .opts.two .opt svg{width:110px;height:110px}
.pg[data-p="avatar"] .opt[aria-pressed="true"]{background:#FFF3BF}
.pg[data-p="avatar"] .opt .price{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;background:var(--accent);color:#fff;font-size:13px}
.pg[data-p="avatar"] .opt .price svg,.pg[data-p="avatar"] .opt .need svg{width:14px;height:14px}
.pg[data-p="avatar"] .opt.own .price{background:#16915F}
.pg[data-p="avatar"] .opt.wearing .price{background:#E8590C}
.pg[data-p="avatar"] .opt.cant{opacity:.6}
.pg[data-p="avatar"] .opt .need{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--muted)}
.pg[data-p="avatar"] .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-weight:600;box-shadow:0 6px 18px rgba(20,40,75,.3)}
/* ===== times ===== */
.pg[data-p="times"]{--ink:#14284B;--muted:#54627A;--grid:#DCE8F7;--accent:#1F5EFF;--ok:#16915F}
.pg[data-p="times"]{margin:0;color:var(--ink);font:500 16px/1.4 "Fredoka",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background-color:#fff;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
.pg[data-p="times"] .wrap{max-width:520px;margin:0 auto;padding:16px 14px 120px}
.pg[data-p="times"] .top{display:flex;align-items:center;justify-content:space-between}
.pg[data-p="times"] .top a,.pg[data-p="times"] .top button.lk{color:var(--accent);font:inherit;font-weight:600;text-decoration:none;border:0;background:none;cursor:pointer;padding:4px 0}
.pg[data-p="times"] h1{margin:6px 0 2px;font-size:28px}
.pg[data-p="times"] .sub{margin:0 0 12px;color:var(--muted)}
.pg[data-p="times"] .card{background:#fff;border:3px solid var(--ink);border-radius:22px;padding:14px;margin-bottom:14px;box-shadow:0 6px 0 var(--ink)}
.pg[data-p="times"] .kn{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.pg[data-p="times"] .kn b{font-size:18px}
.pg[data-p="times"] .legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;color:var(--muted);margin-top:8px}
.pg[data-p="times"] .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.pg[data-p="times"] .fmap{display:grid;grid-template-columns:22px repeat(12,1fr);gap:2px;font-size:10px;font-weight:700;text-align:center}
.pg[data-p="times"] .fmap span{aspect-ratio:1;display:grid;place-items:center;border-radius:4px}
.pg[data-p="times"] .fmap .h{color:var(--muted)}
.pg[data-p="times"] .c0{background:#E9ECF1}
.pg[data-p="times"] .c1{background:#FF8787}
.pg[data-p="times"] .c2{background:#FFD43B}
.pg[data-p="times"] .c3{background:#51CF66}
.pg[data-p="times"] .tbls{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pg[data-p="times"] .tbls button{position:relative;height:66px;border-radius:16px;border:3px solid var(--ink);background:#fff;font:700 20px "Fredoka",system-ui,sans-serif;color:var(--ink);box-shadow:0 4px 0 var(--ink);cursor:pointer}
.pg[data-p="times"] .tbls button small{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.pg[data-p="times"] .tbls button .bar{position:absolute;left:8px;right:8px;bottom:6px;height:4px;border-radius:2px;background:#E9ECF1;overflow:hidden}
.pg[data-p="times"] .tbls button .bar i{display:block;height:100%;background:var(--ok)}
.pg[data-p="times"] .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:54px;margin-top:10px;border:3px solid var(--ink);border-radius:16px;background:var(--accent);color:#fff;font:600 18px "Fredoka",system-ui,sans-serif;box-shadow:0 4px 0 var(--ink);cursor:pointer}
.pg[data-p="times"] .btn.alt{background:#fff;color:var(--ink)}
.pg[data-p="times"] .btn.gold{background:linear-gradient(180deg,#FFD34D,#FFA41B);color:var(--ink)}
.pg[data-p="times"] .btn:active,.pg[data-p="times"] .tbls button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.pg[data-p="times"] .lines{list-style:none;margin:8px 0 0;padding:0;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.pg[data-p="times"] .lines li{display:flex;justify-content:space-between;padding:6px 12px;border-radius:12px;transition:background .2s}
.pg[data-p="times"] .lines li.on{background:#FFF3BF}
.pg[data-p="times"] .lines li .fs{width:12px;height:12px;border-radius:50%;align-self:center}
.pg[data-p="times"] .qbig{text-align:center;font-size:52px;font-weight:700;margin:6px 0;font-variant-numeric:tabular-nums}
.pg[data-p="times"] .ans{height:62px;border:3px solid var(--ink);border-radius:16px;display:grid;place-items:center;font-size:34px;font-weight:700;background:#F5F8FF}
.pg[data-p="times"] .ans.good{background:#D3F9D8;border-color:var(--ok)}
.pg[data-p="times"] .ans.bad{background:#FFE3E3;border-color:#E03131}
.pg[data-p="times"] .fb{min-height:26px;text-align:center;font-weight:700;margin:6px 0}
.pg[data-p="times"] .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.pg[data-p="times"] .pad button{height:54px;border-radius:14px;border:2.5px solid var(--ink);background:#fff;font:700 24px "Fredoka",system-ui,sans-serif;color:var(--ink);box-shadow:0 3px 0 var(--ink);cursor:pointer}
.pg[data-p="times"] .pad button.go{background:var(--accent);color:#fff}
.pg[data-p="times"] .pad button.x{background:#F1F3F8}
.pg[data-p="times"] .pr{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-weight:600;color:var(--muted)}
.pg[data-p="times"] .prog{flex:1;height:12px;border-radius:99px;background:#E9ECF1;overflow:hidden}
.pg[data-p="times"] .prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.pg[data-p="times"] .road{position:relative;height:46px;margin:4px 0 8px;border-radius:12px;background:repeating-linear-gradient(90deg,#495057 0 22px,#5c636a 22px 44px);border:3px solid var(--ink)}
.pg[data-p="times"] .road::after{content:"";position:absolute;left:0;right:0;top:50%;border-top:3px dashed #FFE066}
.pg[data-p="times"] .car{position:absolute;top:4px;left:0;width:48px;height:32px;transition:left .25s ease}
.pg[data-p="times"] .res{text-align:center}
.pg[data-p="times"] .res .big{font-size:40px;font-weight:700}
/* ===== Math Up chunky look: thick borders and thick shadows on every card and button ===== */
.pg[data-p] .sheet,.pg[data-p] .card,.pg[data-p] .lv,.pg[data-p] .tp,.pg[data-p] .tile,.pg[data-p] .boss-entry,.pg[data-p] .hb,.pg[data-p] .emrow{border:3px solid #14284B !important;border-radius:22px !important;box-shadow:0 6px 0 #14284B !important;margin-bottom:16px}
.pg[data-p] .rpt{border:3px solid #14284B !important;border-radius:20px !important;box-shadow:0 5px 0 #14284B !important}
.pg[data-p] .btn,.pg[data-p] .go,.pg[data-p] .sm,.pg[data-p] .pill,.pg[data-p] .toggle:not(.pin-show){border:3px solid #14284B !important;box-shadow:0 5px 0 #14284B !important;transition:transform .08s ease,box-shadow .08s ease}
.pg[data-p] .btn:active,.pg[data-p] .go:active,.pg[data-p] .sm:active,.pg[data-p] .pill:active,.pg[data-p] .lv:active,.pg[data-p] .tp:active,.pg[data-p] .boss-entry:active,.pg[data-p] .hb:active{transform:translateY(5px) !important;box-shadow:0 1px 0 #14284B !important}
.pg[data-p] input:not([type=checkbox]):not([type=range]),.pg[data-p] select{border-width:3px !important;border-radius:16px !important}
.pg[data-p="boss"] .card{box-shadow:0 8px 0 #14284B !important}

/* ===== student profile chip: picture + level bar, top-left on every student page ===== */
.pg[data-p] .stu-slot{display:block;min-width:0}
.pg[data-p] .stu-row{margin:0 0 12px}
.pg[data-p] .stu-chip{display:inline-flex;align-items:center;gap:12px;color:#14284B;text-decoration:none;-webkit-tap-highlight-color:transparent}
.pg[data-p] .stu-chip .sc-av{position:relative;flex:none;width:50px;height:50px}
.pg[data-p] .stu-chip .sc-pic{display:block;width:50px;height:50px;border-radius:50%;overflow:hidden;background:#fff;border:3px solid #14284B;box-shadow:0 3px 0 #14284B}
.pg[data-p] .stu-chip .sc-pic svg{display:block;width:100%;height:100%}
.pg[data-p] .stu-chip .sc-lv{position:absolute;right:-9px;bottom:-6px;min-width:30px;height:22px;padding:0 5px;border-radius:9px;display:grid;place-items:center;font:700 12px/1 "Fredoka",system-ui,sans-serif;color:#fff;background:linear-gradient(180deg,#FFD34D,#F59F00);border:2.5px solid #14284B;white-space:nowrap}
.pg[data-p] .stu-chip .sc-bar{display:block;width:56px;height:14px;border-radius:99px;background:#E7ECF4;border:2.5px solid #14284B;overflow:hidden}
.pg[data-p] .stu-chip .sc-bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#4DABF7,#1F5EFF);transition:width .9s cubic-bezier(.22,1,.36,1)}
.pg[data-p] .top:has(.stu-slot){flex-wrap:nowrap}
.pg[data-p] .top .stu-slot{flex:none}
.pg[data-p] .top:has(.stu-slot)>span:last-child{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;white-space:nowrap}
.pg[data-p="lessons"] .top .pill{height:36px;padding:0 9px;font-size:15px}
.pg[data-p="lessons"] .top>span:last-child{gap:5px}
.pg[data-p="practice"] #home>h1{margin-bottom:14px}
/* ===== home boxes (lessons page): same size, picture on the left ===== */
.pg[data-p="lessons"] .hb{display:flex;align-items:center;gap:14px;width:100%;height:112px;margin:0 0 16px;padding:10px 14px 10px 10px;background:#fff;color:#14284B;text-align:left;text-decoration:none;cursor:pointer;font:inherit}
.pg[data-p="lessons"] .hb .hb-art{flex:none;display:grid;place-items:center;width:72px;height:72px;border-radius:18px;background:#EAF1FF}
.pg[data-p="lessons"] .hb .hb-art svg{width:58px;height:58px;display:block}
.pg[data-p="lessons"] .hb.ws .hb-art{background:#FFF4D6}
.pg[data-p="lessons"] .hb.boss .hb-art{background:#EFE8FF}
.pg[data-p="lessons"] .hb .hb-t{flex:1;min-width:0;display:flex;flex-direction:column}
.pg[data-p="lessons"] .hb .hb-k{font-size:13px;font-weight:700;color:var(--accent)}
.pg[data-p="lessons"] .hb b{font-size:19px;line-height:1.2;font-weight:700}
.pg[data-p="lessons"] .hb small{margin-top:2px;color:var(--muted);font-size:14px;line-height:1.3}
.pg[data-p="lessons"] .hb .hb-go{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-weight:700;font-size:22px}
.pg[data-p="lessons"] .hb.boss .hb-go{background:#7048E8}
.pg[data-p="lessons"] .hb.locked{background:#EEF1F7}
.pg[data-p="lessons"] .hb.locked .hb-art{background:#fff}
.pg[data-p="lessons"] .hb.locked .hb-art svg{filter:grayscale(1);opacity:.6}
.pg[data-p="lessons"] .hb.locked .hb-go{background:#D9DFEA}

/* ===== brand (shared) ===== */
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand-mark{flex:none;width:46px;height:46px;display:block}
.brand-mark svg{display:block;width:100%;height:100%}
.brand-text{display:flex;flex-direction:column;min-width:0;line-height:1.1}
.brand-text b{font:700 26px/1.05 "Fredoka",system-ui,sans-serif;letter-spacing:-.02em;color:#14284B}
.brand-text small{font:500 12.5px/1.3 "Fredoka",system-ui,sans-serif;color:#54627A;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg[data-p="signup"] .brand,.pg[data-p="forgot"] .brand,.pg[data-p="reset"] .brand{margin:0 0 16px}
/* ===== login: fits one screen, no scrolling ===== */
.pg[data-p="login"] .page{min-height:100%;min-height:100dvh;justify-content:center;padding:14px 18px 16px}
.pg[data-p="login"] .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px}
.pg[data-p="login"] .sheet{padding:18px 18px 16px!important}
.pg[data-p="login"] h1{font-size:clamp(1.55rem,6.6vw,1.9rem)!important;margin:0 0 2px!important}
.pg[data-p="login"] .sub{margin:0 0 14px!important;font-size:15px}
.pg[data-p="login"] .tabs{margin-bottom:14px!important}
.pg[data-p="login"] .tabs button{height:46px!important;font-size:15.5px!important}
.pg[data-p="login"] .field{margin-bottom:6px!important}
.pg[data-p="login"] label{margin-bottom:4px!important;font-size:15px!important}
.pg[data-p="login"] .lrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pg[data-p="login"] .lrow label{margin:0!important}
.pg[data-p="login"] .lrow .pin-show{position:static!important;display:inline-block!important;margin:0!important;height:auto!important;padding:2px 4px!important;font-size:14px!important;box-shadow:none!important;border:0!important}
.pg[data-p="login"] input{height:50px!important}
.pg[data-p="login"] .err{min-height:0!important;margin:2px 0 0!important;font-size:13.5px!important}
.pg[data-p="login"] .err:empty{margin:0!important}
.pg[data-p="login"] .mu-pin{padding:12px 0 10px!important}
.pg[data-p="login"] .help{margin:0 0 12px!important;font-size:14px!important}
.pg[data-p="login"] .btn{height:54px!important}
.pg[data-p="login"] .status{min-height:0!important;margin:8px 0 0!important}
.pg[data-p="login"] .status:empty{margin:0!important}
.pg[data-p="login"] .alt{margin:12px 0 0!important;font-size:14px!important;padding:4px 10px!important}
@media (max-height:640px){.pg[data-p="login"] .page{padding-top:10px;padding-bottom:10px}.pg[data-p="login"] .topbar{margin-bottom:10px}.pg[data-p="login"] .brand-text small{display:none}.pg[data-p="login"] .sub{margin-bottom:10px!important}.pg[data-p="login"] .tabs{margin-bottom:10px!important}.pg[data-p="login"] .mu-pin{padding:8px 0 6px!important}}
/* ===== slow-server hint (no popup, no star) ===== */
#mu-load{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:3000;max-width:min(86vw,340px);padding:10px 16px;border-radius:16px;background:#fff;border:2px solid #E5E5E5;box-shadow:0 4px 0 #E5E5E5;font:500 14px/1.35 "Fredoka",system-ui,sans-serif;color:#54627A;text-align:center;opacity:0;transform:translate(-50%,10px);transition:opacity .25s,transform .25s;pointer-events:none}
#mu-load.on{opacity:1;transform:translate(-50%,0)}

/* worksheet: sentence questions read at a proper size with the answer box on the right */
.pg[data-p="print"] .qs.storyq > div{font-size:24px;gap:14px;white-space:normal}
.pg[data-p="print"] .qs.storyq .rich{flex:1;flex-direction:row;align-items:center;justify-content:space-between;gap:18px;font-size:22px;line-height:1.3}
.pg[data-p="print"] .qs.storyq .rich .rq{flex:1;min-width:0}
.pg[data-p="print"] .qs.storyq .rich .box,.pg[data-p="print"] .qs.storyq .rich .ans{flex:none}

/* eye toggle inside password boxes */
.pg[data-p] .toggle.eye{position:absolute!important;right:6px!important;top:50%!important;transform:translateY(-50%)!important;width:44px!important;height:44px!important;min-width:0!important;padding:0!important;margin:0!important;display:grid!important;place-items:center!important;border:0!important;border-radius:12px!important;background:transparent!important;box-shadow:none!important;color:#54627A!important;cursor:pointer}
.pg[data-p] .toggle.eye:active{transform:translateY(-50%) scale(.92)!important;box-shadow:none!important}
.pg[data-p] .toggle.eye[aria-pressed="true"]{color:#1F5EFF!important}
.pg[data-p] .control input{padding-right:54px!important}

/* picture sheets: 6 per page always fit on A4, with readable question text */
.pg[data-p="print"] .qs{min-height:0}
.pg[data-p="print"] .qs.picq > div{padding:2px 0 3px}
.pg[data-p="print"] .qs.picq .rich{font-size:18px!important;line-height:1.25;gap:6px}
.pg[data-p="print"] .qs.picq .rich .pic svg{height:110px}
.pg[data-p="print"] .qs.picq .rich .pic svg[viewBox$=" 190"]{height:138px}
.pg[data-p="print"] .qs.picq .box,.pg[data-p="print"] .qs.picq .ans{height:44px}

.pg[data-p="print"] .qs.picq.big .rich .pic svg{height:250px}
.pg[data-p="print"] .qs.picq.big .rich{font-size:20px!important}

.pg[data-p="print"] .qs > div{min-width:0}
/* every page fills the whole screen (no white strip under short pages) */
.pg[data-p]{min-height:100vh;min-height:100dvh;box-sizing:border-box}
/* ===== Powered by Excellent Mindblow ===== */
:root{--pow-h:44px}
#app{min-height:calc(100% - var(--pow-h))!important}
.pg[data-p]{min-height:calc(100vh - var(--pow-h));min-height:calc(100dvh - var(--pow-h))}
.pg[data-p="login"] .page{min-height:calc(100dvh - var(--pow-h))!important}
#mu-pow{height:var(--pow-h);box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:7px;padding:0 12px env(safe-area-inset-bottom,0px);background:#fff;border-top:1px solid #E3EAF5;font:500 13px/1 "Fredoka",system-ui,sans-serif;color:#54627A}
#mu-pow .em{display:inline-block;width:30px;height:26px}
#mu-pow .em svg{display:block;width:100%;height:100%}
#mu-pow b{font-weight:700;color:#14284B;letter-spacing:.02em}
#mu-pow b i{font-style:normal;background:linear-gradient(90deg,#2FB5FF,#3D6BFF 55%,#9B4DFF);-webkit-background-clip:text;background-clip:text;color:transparent}
#mu-pow[hidden]{display:none}
@media print{#mu-pow,#mu-splash,#mu-splash2{display:none!important}}
#mu-splash{position:fixed;inset:0;z-index:5000;display:none;align-items:center;justify-content:center;background:#0A9DFD;transition:opacity .35s ease;flex-direction:column;text-align:center;padding:24px}
#mu-splash.on{display:flex}
#mu-splash.out{opacity:0;pointer-events:none}

<script>
// voice speed (lower = slower). tts = the phone's own voice, clip = the recorded voice/*.mp3 files
window.MU_VOICE = { tts: 0.8, clip: 0.9 };
// launch screens, once each time the app is opened: 1) the app icon on blue, 2) the word "Math Up" on the same blue
(function(){
  var sp = document.getElementById("mu-splash"), sp2 = document.getElementById("mu-splash2"); if (!sp) return;
  var seen = false; try { seen = sessionStorage.getItem("mathup:splash") === "1"; sessionStorage.setItem("mathup:splash", "1"); } catch (e) {}
  if (seen) { sp.remove(); if (sp2) sp2.remove(); return; }
  var meta = document.querySelector('meta[name="theme-color"]'), old = meta && meta.content;
  var bar = function(c){ if (meta) meta.content = c; };
  bar("#0A9DFD");                                         // phone status bar matches the splash
  sp.classList.add("on"); if (sp2) sp2.classList.add("on");   // the word screen waits underneath
  var t0 = Date.now(), closed = false, closed2 = false;
  var close2 = function(){ if (closed2) return; closed2 = true; bar(old); if (sp2){ sp2.classList.add("out"); setTimeout(function(){ sp2.remove(); }, 450); } };
  var close = function(){ if (closed) return; closed = true; sp.classList.add("out"); setTimeout(function(){ sp.remove(); }, 400);
    if (sp2) setTimeout(close2, 1300); else bar(old); };
  var ready = function(){ setTimeout(close, Math.max(0, 1300 - (Date.now() - t0))); };   // icon screen: at least 1.3 s, then the word screen for 1.3 s
  if (document.readyState === "complete") ready(); else addEventListener("load", ready);
  setTimeout(close, 3500); sp.addEventListener("click", close); if (sp2) sp2.addEventListener("click", function(){ close(); close2(); });
})();
// the "Powered by" footer sits under every page except full-screen games
(function(){

})();
</script>

const LK = (() => {
  const TITLES = {"login": "Log in \u00b7 Math Up", "signup": "Create account \u00b7 Math Up", "forgot": "Forgot password \u00b7 Math Up", "reset": "New password \u00b7 Math Up", "dashboard": "Your children \u00b7 Math Up", "lessons": "Learn \u00b7 Math Up", "practice": "Practice \u00b7 Math Up", "privacy": "Privacy Policy \u00b7 Math Up", "terms": "Terms of Use \u00b7 Math Up", "print": "Print worksheets \u00b7 Math Up", "boss": "Boss Battle \u00b7 Math Up", "admin": "Admin \u00b7 Math Up", "avatar": "My avatar \u00b7 Math Up", "times": "Times tables \u00b7 Math Up", "abacus": "Soroban abacus \u00b7 Math Up"};
  const app = () => document.getElementById("app");
  let cur = null, tracked = { l: [], i: [], t: [], r: [] };
  // anything a screen starts (timers, key listeners) is stopped when you leave it
  const addW = window.addEventListener.bind(window), addD = document.addEventListener.bind(document);
  window.addEventListener = function(t, f, o){ if (cur) tracked.l.push([window, t, f, o]); return addW(t, f, o); };
  document.addEventListener = function(t, f, o){ if (cur) tracked.l.push([document, t, f, o]); return addD(t, f, o); };
  const T = {
    setInterval: (f, ms, ...a) => { const id = window.setInterval(f, ms, ...a); tracked.i.push(id); return id; },
    setTimeout: (f, ms, ...a) => { const id = window.setTimeout(f, ms, ...a); tracked.t.push(id); return id; },
    requestAnimationFrame: f => { const id = window.requestAnimationFrame(f); tracked.r.push(id); return id; }
  };
  function cleanup(){
    tracked.l.forEach(([o, t, f, op]) => o.removeEventListener(t, f, op));
    tracked.i.forEach(clearInterval); tracked.t.forEach(clearTimeout); tracked.r.forEach(cancelAnimationFrame);
    tracked = { l: [], i: [], t: [], r: [] };
    try { speechSynthesis.cancel(); } catch (e) {}
    document.querySelectorAll("audio").forEach(a => { try { a.pause(); } catch (e) {} });
  }
  const norm = t => { t = String(t || "login").replace(/^.*\//, "").replace(/^#\/?/, "").replace(/\.html.*$/, "").replace(/\?.*$/, ""); return t === "index" || !t ? "login" : t; };
  function render(name){
    if (!LK.pages[name]) name = "login";
    if (name === "login"){ const s = MU.session(); if (s && s.token){ name = s.role === "student" ? "lessons" : "dashboard"; history.replaceState(null, "", "#/" + name); } }
    if (name === "lessons" && !MU.young()){ name = "practice"; history.replaceState(null, "", "#/practice"); }   // ages 7+ go straight to Practice
    cleanup(); cur = name;
    const tpl = document.getElementById("tpl-" + name);
    app().innerHTML = `<div class="pg" data-p="${name}">${tpl.innerHTML}</div>`;
    document.title = TITLES[name] || "Math Up";
    window.scrollTo(0, 0);
    try { LK.pages[name](T.setInterval, T.setTimeout, T.requestAnimationFrame, app().firstElementChild); } catch (e) { console.error(e); }
    try { if (window.StuChip) StuChip.mountAll(app()); } catch (e) { console.error(e); }
    try { if (window.UPI_AFTER) UPI_AFTER(name); } catch (e) { console.error(e); }
    try { if (window.MUS_ROUTE) MUS_ROUTE(name); } catch (e) { console.error(e); }
  }
  function go(target, replace){
    const name = norm(target);
    if (replace) history.replaceState(null, "", location.pathname + location.search + "#/" + name);
    else history.pushState(null, "", location.pathname + location.search + "#/" + name);
    render(name);
  }
  addW("hashchange", () => render(norm(location.hash)));
  // a new day: refresh the open screen (unless a worksheet or battle is in progress), so "today" resets
  const ymdNow = () => { const n = new Date(); return n.getFullYear() + "-" + String(n.getMonth() + 1).padStart(2, "0") + "-" + String(n.getDate()).padStart(2, "0"); };
  let dayNow = ymdNow();
  const checkDay = () => {
    const d = ymdNow(); if (d === dayNow) return; dayNow = d;
    const busy = document.querySelector('.pg #ws:not([hidden]), .pg #mark:not([hidden]), .pg[data-p="lessons"] #lesson:not([hidden])') || (cur === "boss" && !document.querySelector(".pg .overlay"));
    if (!busy) render(cur || "login");
  };
  window.setInterval(checkDay, 30000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) checkDay(); });
  addW("focus", checkDay); addW("pageshow", checkDay);
  addW("popstate", () => render(norm(location.hash)));
  return { go, pages: {}, current: () => cur, start: () => render(norm(location.hash)) };
})();

// Wake the Google Script while the person is still typing, so their first real tap isn't the slow one.
(function warmServer(){
  const K = "mathup:warm";
  const ping = () => { try {
    if (!navigator.onLine || MU_API.indexOf("PASTE") === 0) return;
    const last = Number(sessionStorage.getItem(K) || 0); if (Date.now() - last < 240000) return;
    sessionStorage.setItem(K, String(Date.now()));
    fetch(MU_API, { mode: "no-cors", cache: "no-store" }).catch(() => {});
  } catch (e) {} };
  ping(); addEventListener("pageshow", ping);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) ping(); });
})();


// Shared learning rules: points, goal times and how we spot a child's limitations.
const MUX = {
  NAMES: ["Count up", "What is missing?", "Add within 10", "Subtract within 10", "Add within 20", "Subtract within 20", "Add 2-digit numbers", "Subtract 2-digit numbers", "Times 2 to 5", "Times up to 9 × 9", "Divide", "Add 3-digit numbers", "Subtract 3-digit numbers", "2-digit × 1-digit", "Bigger division", "Add fractions", "Decimals", "Negative numbers", "Order of operations", "Find x"],
  SECS_PER_Q: [6, 6, 6, 6, 8, 8, 12, 12, 6, 6, 8, 18, 18, 20, 20, 15, 15, 12, 15, 15],
  LEVEL_POINTS: 600,
  goal: lv => MUX.SECS_PER_Q[lv] * 10,
  // Points only for a passed worksheet (9+ right), so repeating a failed one can't farm points.
  award: (right, secs, lv) => right < 9 ? 0 : 60 + right * 4 + (secs <= MUX.goal(lv) ? 20 : 0),
  // Remember this attempt: right, seconds, rushed wrong answers (under 2 seconds), and the questions missed.
  rec(P, lv, right, secs, rushed, wrong){
    ["s", "d", "p", "h", "m"].forEach(k => { P[k] = P[k] || {}; });
    P.h[lv] = (P.h[lv] || []).concat([{ r: right, s: secs, x: rushed, t: Date.now() }]).slice(-5);
    if (wrong.length) P.m[lv] = (P.m[lv] || []).concat(wrong).slice(-6);
  },
  // Looks at the last few worksheets of one level (ignores anything older than 14 days).
  analyze(P, lv){
    const all = (P && P.h && P.h[lv]) || [], h = all.filter(e => Date.now() - (e.t || 0) < 14 * 864e5);
    if (!h.length) return { kind: "ok" };
    const last = h.slice(-3), goal = MUX.goal(lv), sum = k => last.reduce((t, e) => t + e[k], 0);
    if ((h.length >= 2 && h.slice(-2).every(e => e.r < 9)) || (last.length === 3 && sum("r") / 3 < 7)) return { kind: "support" };
    if (h[h.length - 1].x >= 2) return { kind: "rushing" };
    if (last.length === 3 && last.every(e => e.r === 10 && e.s <= goal)) return { kind: "ready" };
    if (last.length === 3 && last.every(e => e.r >= 9) && sum("s") / 3 > goal * 1.6) return { kind: "slow" };
    return { kind: "ok" };
  },
  // For the parent: every level that needs attention, most important first.
  focus(P){
    const rank = { support: 0, rushing: 1, slow: 2, ready: 3 }, out = [];
    for (let lv = 0; lv < 20; lv++){
      const a = MUX.analyze(P, lv);
      if (a.kind !== "ok") out.push({ lv, name: MUX.NAMES[lv], kind: a.kind, misses: a.kind === "support" ? ((P.m && P.m[lv]) || []).slice(-2) : [] });
    }
    return out.sort((a, b) => rank[a.kind] - rank[b.kind]).slice(0, 4);
  },
  say: {
    child: { support: "This one is tricky, and that's okay. Let's build up with an easier level first.", rushing: "Take your time. Check each answer before you press Check.", slow: "You get them right! Keep practicing and you'll get faster.", ready: "You're doing so well! Want to try the next level?", ok: "" },
    parent: { support: "Needs support: missed several worksheets in a row. Try the level below, or practice this one together.", rushing: "Answering very fast and guessing. Encourage checking each answer.", slow: "Accurate but slow. More repetition will build speed.", ready: "Ready to move up: three perfect worksheets on time." }
  },
  fmt: n => Math.floor(n / 60) + ":" + String(n % 60).padStart(2, "0")
};

// ---------- PIN dots ----------
function pinDots(inp){
  if (!inp || inp.dataset.dots) return; inp.dataset.dots = "1";
  if (!document.getElementById("mu-pin-css")){
    const st = document.createElement("style"); st.id = "mu-pin-css";
    st.textContent = `.mu-pin{position:relative;display:flex;gap:22px;justify-content:center;align-items:center;padding:18px 0;cursor:text}
.mu-pin input{position:absolute;inset:0;width:100%;height:100%;opacity:.01;color:transparent;caret-color:transparent;border:0;background:transparent;font-size:16px;letter-spacing:40px;z-index:2;padding:0}
.mu-pin .d{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink,#14284B);background:transparent;display:grid;place-items:center;font:700 24px/16px "Fredoka",system-ui,sans-serif;color:var(--ink,#14284B);transition:transform .18s cubic-bezier(.34,1.56,.64,1),background-color .18s,border-color .18s}
.mu-pin .d.on{background:var(--ink,#14284B);border-color:var(--ink,#14284B);transform:scale(1)}
.mu-pin .d.num{background:transparent;border-color:transparent}
.mu-pin .d.on.pop{animation:muPop .22s cubic-bezier(.34,1.56,.64,1)}
.mu-pin.focus .d.next{border-color:var(--accent,#1F5EFF);box-shadow:0 0 0 3px rgba(31,94,255,.2)}
.mu-pin.bad .d{border-color:var(--err,#C62828)}
.mu-pin.bad .d.on:not(.num){background:var(--err,#C62828)}
@keyframes muPop{from{transform:scale(.4)}60%{transform:scale(1.25)}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.mu-pin .d{transition:none}.mu-pin .d.on.pop{animation:none}}`;
    document.head.appendChild(st);
  }
  const n = +inp.getAttribute("maxlength") || 4, wrap = document.createElement("div");
  wrap.className = "mu-pin"; inp.parentNode.insertBefore(wrap, inp);
  const dots = [];
  for (let i = 0; i < n; i++){ const d = document.createElement("span"); d.className = "d"; d.setAttribute("aria-hidden", "true"); wrap.appendChild(d); dots.push(d); }
  wrap.appendChild(inp);
  let last = 0;
  const draw = () => {
    const v = inp.value.replace(/\D/g, "").slice(0, n); if (v !== inp.value) inp.value = v;
    const show = inp.type !== "password";
    dots.forEach((d, i) => { const on = i < v.length; d.classList.toggle("on", on); d.classList.toggle("next", i === v.length); d.classList.toggle("num", on && show); d.textContent = on && show ? v[i] : ""; if (on && i >= last) { d.classList.remove("pop"); void d.offsetWidth; d.classList.add("pop"); } });
    last = v.length;
    wrap.classList.toggle("bad", inp.getAttribute("aria-invalid") === "true");
  };
  inp.addEventListener("input", draw);
  inp.addEventListener("focus", () => wrap.classList.add("focus")); inp.addEventListener("blur", () => wrap.classList.remove("focus"));
  new MutationObserver(draw).observe(inp, { attributes: true, attributeFilter: ["type", "aria-invalid"] });
  draw();
}

// In-app loading: the top bar and bouncing dots (Duo layer) already show activity. This only adds a small hint when the server is slow to wake.
const MULoad = (() => {
  let n = 0, el = null, slowT = 0;
  const ms = () => window.I18N && I18N.lang && I18N.lang() === "ms";
  function slow(){ if (document.getElementById("st")) return;      // login page shows its own hint
    if (!el){ el = document.createElement("div"); el.id = "mu-load"; el.setAttribute("role", "status"); el.setAttribute("aria-live", "polite"); document.body.appendChild(el); }
    el.textContent = ms() ? "Sedang hidupkan pelayan. Kali pertama boleh ambil masa hingga 20 saat." : "Waking up the server. The first try can take up to 20 seconds.";
    void el.offsetWidth; el.classList.add("on"); }
  function hide(){ clearTimeout(slowT); if (el) el.classList.remove("on"); }
  return {
    start(){ if (n++ === 0){ clearTimeout(slowT); slowT = setTimeout(slow, 4000); } },
    end(){ n = Math.max(0, n - 1); if (!n) hide(); },
    async wrap(p){ this.start(); try { return await p; } finally { this.end(); } }
  };
})();
window.MULoad = MULoad;
const MU = (() => {
  const K = "mathup:session";
  const read = () => { try { return JSON.parse(localStorage.getItem(K) || "null"); } catch (e) { return null; } };
  const write = s => { try { s ? localStorage.setItem(K, JSON.stringify(s)) : localStorage.removeItem(K); } catch (e) {} };
  const QUIET = { saveProgress: 1, getProgress: 1, logout: 1 };
  async function raw(action, body){ if (QUIET[action]) return raw0(action, body); MULoad.start(); try { return await raw0(action, body); } finally { MULoad.end(); } }
  async function raw0(action, body){
    if (MU_API.indexOf("PASTE") === 0) return { error: "The server isn't connected yet." };
    if (!navigator.onLine) return { error: "You're offline. Connect to the internet and try again.", offline: true };
    // A Google Script that has been idle needs a few seconds to wake up, so say so and don't wait forever.
    const HINT = "Waking up the server. The first try can take up to 20 seconds.", ac = new AbortController();
    const hint = setTimeout(() => { const st = document.getElementById("st"); if (st && !st.textContent) st.textContent = HINT; }, 4000);
    const stop = setTimeout(() => ac.abort(), 60000);
    try {
      const r = await fetch(MU_API, { method: "POST", body: JSON.stringify(Object.assign({ action }, body || {})), signal: ac.signal });
      return await r.json();
    } catch (e) { return { error: e && e.name === "AbortError" ? "The server took too long. Please try again." : "Couldn't reach the server. Check your connection and try again.", offline: !navigator.onLine || !(e && e.name === "AbortError") }; }
    finally { clearTimeout(hint); clearTimeout(stop); const st = document.getElementById("st"); if (st && st.textContent === HINT) st.textContent = ""; }
  }
  async function call(action, body){
    const s = read();
    const r = await raw(action, Object.assign({ token: s && s.token }, body || {}));
    if (r && r.error === "session"){ write(null); try { localStorage.removeItem("mathup:outbox"); } catch (e) {} LK.go("login"); }
    return r;
  }
  const keep = (r, owner) => {
    if (r.ok && owner) { try { const O = "mathup:owner", prev = localStorage.getItem(O); if (prev && prev !== owner) { localStorage.removeItem("mathup:stars"); localStorage.removeItem("mathup:progress"); } localStorage.setItem(O, owner); } catch (e) {} }
    if (r.ok) write({ token: r.token, role: r.role, name: r.name || "", level: r.level == null ? -1 : r.level });
    return r;
  };
  const LAST = "mathup:last";
  const remember = (mode, id) => { try { const l = JSON.parse(localStorage.getItem(LAST) || "{}"); l.mode = mode; if (mode === "student") l.sid = id; else l.email = id; localStorage.setItem(LAST, JSON.stringify(l)); } catch (e) {} };
  const saveCred = (id, secret, name) => { try { if (window.PasswordCredential && navigator.credentials) navigator.credentials.store(new PasswordCredential({ id, password: secret, name: name || id })).catch(() => {}); } catch (e) {} };
  // Progress made offline waits here and is sent as soon as the internet is back.
  const OUT = "mathup:outbox";
  let sending = false;
  async function flush(){
    const s = read(); if (sending || !s || s.role !== "student" || !navigator.onLine) return;
    let box; try { box = JSON.parse(localStorage.getItem(OUT) || "null"); } catch (e) {}
    if (!box || !box.patch) return;
    sending = true;
    const r = await call("saveProgress", { patch: box.patch });
    sending = false;
    if (r && r.ok){ try { const now = JSON.parse(localStorage.getItem(OUT) || "null"); if (now && now.v === box.v) localStorage.removeItem(OUT); else flush(); } catch (e) {} }
  }
  window.addEventListener("online", () => { flush(); offlineNote(); });
  window.addEventListener("offline", offlineNote);
  function offlineNote(){
    let n = document.getElementById("mu-offline");
    if (navigator.onLine){ if (n) n.remove(); return; }
    if (n || !document.body) return;
    n = document.createElement("div"); n.id = "mu-offline"; n.setAttribute("role", "status");
    n.textContent = "Offline · your work is saved on this phone";
    n.style.cssText = "position:fixed;left:50%;top:calc(8px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:2000;background:#14284B;color:#fff;font:600 14px/1.2 Fredoka,system-ui,sans-serif;padding:8px 14px;border-radius:99px;box-shadow:0 6px 16px rgba(20,40,75,.25);white-space:nowrap";
    document.body.appendChild(n);
    n.style.transition = "opacity .5s ease, transform .5s ease";
    setTimeout(() => { if (n.isConnected){ n.style.opacity = "0"; n.style.transform = "translateX(-50%) translateY(-12px)"; setTimeout(() => n.remove(), 600); } }, 3500);
  }
  document.addEventListener("DOMContentLoaded", () => { offlineNote(); flush(); });
  return {
    session: read,
    level: () => { const s = read(); return s && s.role === "student" ? s.level : -1; },
    login: async (role, id, secret) => { const r = keep(role === "student" ? await raw("studentLogin", { sid: id, pin: secret }) : await raw("parentLogin", { email: id, password: secret }), role === "student" ? String(id).trim().toLowerCase() : null); if (r.ok){ remember(role, String(id).trim()); saveCred(String(id).trim(), secret); } return r; },
    codeInfo: () => raw("codeInfo", {}),
    admin: (key, op, data) => raw("admin", Object.assign({ key, op }, data || {})),
    signup: async (email, password, agree, code) => { const r = keep(await raw("parentSignup", { email, password, agree, code })); if (r.ok){ remember("parent", email); saveCred(email, password); } return r; },
    last(){ try { return JSON.parse(localStorage.getItem(LAST) || "{}"); } catch (e) { return {}; } },
    forgot: email => raw("requestReset", { email }),
    reset: (token, password) => raw("resetPassword", { token, password }),
    logout(){ const s = read(); if (s) raw("logout", { token: s.token }); write(null); LK.go("login"); },
    require(role){ const s = read(); if (!s || s.role !== role){ LK.go("login"); return null; } return s; },
    call,
    async pull(){ const s = read(); if (!s || s.role !== "student" || !navigator.onLine) return null; const r = await call("getProgress"); return r && r.ok ? r.progress : null; },
    push(patch){
      const s = read(); if (!s || s.role !== "student") return;
      let box = null; try { box = JSON.parse(localStorage.getItem(OUT) || "null"); } catch (e) {}
      box = { v: Date.now() + Math.random(), patch: Object.assign({}, box && box.patch, patch) };
      try { localStorage.setItem(OUT, JSON.stringify(box)); } catch (e) {}
      flush();
    },
    online: () => navigator.onLine,
    // Child Level and EXP: every worksheet earns EXP; each level needs 50 more EXP than the last.
    xpNeed: n => 150 + (n - 1) * 50,
    xpInfo(xp){ xp = Math.max(0, Math.floor(Number(xp) || 0)); let n = 1, left = xp; while (left >= 150 + (n - 1) * 50){ left -= 150 + (n - 1) * 50; n++; } const need = 150 + (n - 1) * 50; return { level: n, into: left, need, pct: Math.round(left / need * 100) }; },
    // EXP follows accuracy: 8-10 right = full EXP (+20 for 10/10, +20 if fast); 6-7 right = 6 each; 5 or fewer = 3 each.
    xpGain: (right, fast) => right >= 8 ? right * 10 + (right >= 10 ? 20 : 0) + (fast ? 20 : 0) : right >= 6 ? right * 6 : right * 3,
    localDay(offset){ const d = new Date(Date.now() + (offset || 0) * 864e5); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); },
    // Daily diary for Upi's parent reports (last 30 days): worksheets, questions, right answers, time,
    // rushed answers, per-step results, steps mastered, a few mistakes, and Boss Battles.
    logDay(P, u){
      const d0 = new Date(), t = d0.getFullYear() + "-" + String(d0.getMonth() + 1).padStart(2, "0") + "-" + String(d0.getDate()).padStart(2, "0");
      P.log = Array.isArray(P.log) ? P.log : [];
      let e = P.log.find(x => x.d === t);
      if (!e){ e = { d: t, n: 0, q: 0, r: 0, s: 0, x: 0, sp: {}, ms: [], b: 0, bw: 0, wr: [] }; P.log.push(e); }
      if (u.ws){
        e.n++; e.q += u.q || 0; e.r += u.r || 0; e.s += Math.round(u.s || 0); e.x += u.x || 0;
        const k = String(u.step), cur = e.sp[k] || [0, 0]; e.sp[k] = [cur[0] + (u.r || 0), cur[1] + (u.q || 0)];
        if (u.mastered != null && e.ms.indexOf(u.mastered) < 0) e.ms.push(u.mastered);
        (u.wrong || []).forEach(w => { if (e.wr.length < 8) e.wr.push({ q: String(w.q).slice(0, 60), y: String(w.y).slice(0, 12), a: String(w.a).slice(0, 12) }); });
      }
      if (u.levelUp){ e.lu = (e.lu || 0) + 1; e.lv = u.levelUp; }
      if (u.fixed){ e.fx = (e.fx || 0) + u.fixed; }
      if (u.cm){ e.cm = 1; }
      if (u.battle){ e.b++; if (u.won) e.bw++; }
      P.log.sort((x, y) => x.d < y.d ? -1 : 1); P.log = P.log.slice(-30);
    },
    // Lessons are for ages 4-6. A child's starting level comes from their age (4→0, 5→2, 6→4, 7→6 ...)
    young(){ const s = read(); if (!s || s.role !== "student") return true; const lv = Number(s.level); return !(lv >= 0) || lv <= 4; },
    pinDots
  };
})();

LK.pages.abacus = function(setInterval, setTimeout, requestAnimationFrame, __root){
"use strict";
const $ = id => __root.querySelector("#" + CSS.escape(id));
const M = (en, bm) => (window.I18N && I18N.lang && I18N.lang() === "ms") ? bm : en;
const loadP = () => { try { return JSON.parse(localStorage.getItem("mathup:progress") || "{}"); } catch (e) { return {}; } };
let P = loadP(); P.ab = P.ab || {};

const sfx = n => { try { if (window.MUS) MUS.sfx(n); } catch (e) {} };
const say = t => { try { if (window.Upi) Upi.speak(t, () => {}); } catch (e) {} };
const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(x => x[1]);
const view = $("view");
const PLACES = () => [M("Ones", "Sa"), M("Tens", "Puluh"), M("Hundreds", "Ratus"), M("Thousands", "Ribu")];

// ---------- the soroban: 1 bead on top (worth 5) and 4 below (worth 1) on every rod ----------
function soroban(rods, o){
  o = o || {};
  const SP = 64, W = Math.max(rods * SP + 24, 156), H = 266, cx = i => (W - rods * SP) / 2 + SP / 2 + i * SP, VH = H + (o.labels ? 26 : 0);
  const st = Array.from({ length: rods }, () => ({ h: 0, e: 0 }));
  const pl = PLACES();
  const bead = (cls, r, k, color) => `<g class="bd ${cls}" data-r="${r}" data-k="${k}"><ellipse rx="25" ry="14" fill="${color}" stroke="#14284B" stroke-width="3.5"/><ellipse cx="-8" cy="-6" rx="9" ry="3.4" fill="#fff" opacity=".55"/></g>`;
  let g = `<svg viewBox="0 0 ${W} ${VH}" role="img" aria-label="${M("Soroban abacus", "Sempoa soroban")}"><rect x="3" y="3" width="${W - 6}" height="${H - 6}" rx="20" fill="#FFE9CC" stroke="#14284B" stroke-width="5"/>`;
  for (let i = 0; i < rods; i++) g += `<rect x="${cx(i) - 3}" y="12" width="6" height="${H - 24}" rx="3" fill="#B98A5E"/>`;
  g += `<rect x="8" y="96" width="${W - 16}" height="14" fill="#14284B"/>`;
  for (let i = 0; i < rods; i++) g += `<circle cx="${cx(i)}" cy="103" r="2.6" fill="#FFE9CC"/>`;
  for (let i = 0; i < rods; i++){
    g += bead("h", i, 0, "#FF8A3D");
    for (let k = 1; k <= 4; k++) g += bead("e", i, k, "#1CB0F6");
    if (o.labels) g += `<text x="${cx(i)}" y="${H + 18}" text-anchor="middle" font-size="13" font-weight="700" fill="#777" font-family="Fredoka,system-ui,sans-serif">${rods > 3 ? ["1s", "10s", "100s", "1,000s", "10,000s"][rods - 1 - i] : (pl[rods - 1 - i] || "")}</text>`;
  }
  g += "</svg>";
  const el = document.createElement("div"); el.className = "sor"; el.style.maxWidth = (rods <= 2 ? 180 : rods * 70 + 20) + "px"; el.innerHTML = g;
  let locked = !!o.locked;
  const val = () => st.reduce((n, x) => n * 10 + x.h * 5 + x.e, 0);
  const draw = () => el.querySelectorAll(".bd").forEach(b => {
    const r = +b.dataset.r, k = +b.dataset.k, s = st[r]; let y;
    if (b.classList.contains("h")) y = s.h ? 78 : 32; else y = 125 + (k - 1) * 30 + (k <= s.e ? 0 : 24);
    b.style.transform = `translate(${cx(r)}px,${y}px)`;
  });
  el.addEventListener("click", e => {
    const b = e.target.closest(".bd"); if (!b || locked) return;
    const r = +b.dataset.r, s = st[r];
    if (b.classList.contains("h")) s.h ^= 1; else { const k = +b.dataset.k; s.e = k <= s.e ? k - 1 : k; }
    draw(); sfx("pop"); if (o.onChange) o.onChange(val());
  });
  const api = {
    el, get: val,
    set(n){ const d = String(n).padStart(rods, "0").slice(-rods).split("").map(Number); d.forEach((v, i) => { st[i].h = v >= 5 ? 1 : 0; st[i].e = v % 5; }); draw(); },
    clear(){ st.forEach(s => { s.h = 0; s.e = 0; }); draw(); if (o.onChange) o.onChange(0); },
    lock(v){ locked = v; },
    hl(kind, r, k){ el.querySelectorAll(".bd.hl").forEach(b => b.classList.remove("hl")); if (!kind) return; const q = kind === "rod" ? `.bd[data-r="${r}"]` : kind === "h" ? `.bd.h[data-r="${r}"]` : `.bd.e[data-r="${r}"]` + (k ? `[data-k="${k}"]` : ""); el.querySelectorAll(q).forEach(b => b.classList.add("hl")); }
  };
  draw(); return api;
}
